name: Build selinux_seqno_fix.ko

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Kernel source repository
        required: true
        type: string
        default: cctv18/android_kernel_common_oneplus_sm8750
      kernel_branch:
        description: Kernel source branch
        required: true
        type: string
        default: oneplus/sm8750_v_16.0.0_oneplus_13_6.6.89
      kernel_suffix:
        description: Kernel localversion suffix, without leading dash
        required: true
        type: string
        default: android15-8-g7e1f3c083cc6-abogki467167594-4k
      full_kernel_build:
        description: Build in-tree modules first. Slower, useful when you need fresh Module.symvers from a full kernel build.
        required: true
        type: choice
        default: 'false'
        options:
          - 'true'
          - 'false'
  push:
    branches:
      - main
    paths:
      - Kbuild
      - Makefile
      - selinux_seqno_fix.c
      - README.md
      - ksu-module/**
      - .github/workflows/build.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  ARCH: x86_64
  TOOLCHAIN_URL: https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928
  MODULE_NAME: selinux_seqno_fix

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout module source
        uses: actions/checkout@v4

      - name: Resolve build inputs
        id: vars
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo || 'cctv18/android_kernel_common_oneplus_sm8750' }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch || 'oneplus/sm8750_v_16.0.0_oneplus_13_6.6.89' }}
          KERNEL_SUFFIX: ${{ inputs.kernel_suffix || 'android15-8-g7e1f3c083cc6-abogki467167594-4k' }}
        run: |
          set -euxo pipefail
          KERNEL_KEY="$(printf '%s-%s-%s' "$KERNEL_REPO" "$KERNEL_BRANCH" "$KERNEL_SUFFIX" | tr '/:@ ' '----')"
          echo "kernel_repo=$KERNEL_REPO" >> "$GITHUB_OUTPUT"
          echo "kernel_branch=$KERNEL_BRANCH" >> "$GITHUB_OUTPUT"
          echo "kernel_suffix=$KERNEL_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "kernel_key=$KERNEL_KEY" >> "$GITHUB_OUTPUT"

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: downloads
          key: downloads-${{ steps.vars.outputs.kernel_key }}-clang18-r510928
          restore-keys: |
            downloads-${{ steps.vars.outputs.kernel_key }}-

      - name: Restore kernel source/toolchain cache
        id: cache-base
        uses: actions/cache@v4
        with:
          path: |
            kernel_workspace/common
            kernel_workspace/clang18
            kernel_workspace/build-tools
          key: kernel-base-${{ steps.vars.outputs.kernel_key }}-clang18-r510928-v2

      - name: Restore kernel output cache
        id: cache-out
        uses: actions/cache@v4
        with:
          path: kernel_workspace/out
          key: kernel-out-${{ steps.vars.outputs.kernel_key }}-clang18-r510928-v2-${{ hashFiles('Kbuild', 'selinux_seqno_fix.c', 'Makefile') }}
          restore-keys: |
            kernel-out-${{ steps.vars.outputs.kernel_key }}-clang18-r510928-v2-

      - name: Install build dependencies
        run: |
          sudo apt-mark hold firefox || true
          sudo apt-mark hold libc-bin || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential ca-certificates cpio curl dwarves \
            flex git kmod libelf-dev libssl-dev make perl python-is-python3 \
            python3 rsync unzip xz-utils zip

      - name: Fetch kernel source and toolchain
        env:
          KERNEL_REPO: ${{ steps.vars.outputs.kernel_repo }}
          KERNEL_BRANCH: ${{ steps.vars.outputs.kernel_branch }}
        run: |
          set -euxo pipefail
          mkdir -p kernel_workspace downloads
          cd kernel_workspace

          if [[ ! -f common/Makefile ]]; then
            rm -rf common source-unpack
            SOURCE_URL="https://github.com/${KERNEL_REPO}/archive/refs/heads/${KERNEL_BRANCH}.zip"
            if [[ ! -s ../downloads/common.zip ]]; then
              aria2c -s16 -x16 -k1M "$SOURCE_URL" -o ../downloads/common.zip
            fi
            mkdir source-unpack
            unzip -q ../downloads/common.zip -d source-unpack
            KERNEL_DIR="$(find source-unpack -maxdepth 1 -mindepth 1 -type d | head -n 1)"
            test -n "$KERNEL_DIR"
            mv "$KERNEL_DIR" common
            rm -rf source-unpack
          else
            echo "Using cached kernel source."
          fi

          if [[ ! -x clang18/bin/clang ]]; then
            rm -rf clang18
            mkdir -p clang18
            if [[ ! -s ../downloads/clang-r510928.zip ]]; then
              aria2c -s16 -x16 -k1M "${TOOLCHAIN_URL}/clang-r510928.zip" -o ../downloads/clang-r510928.zip
            fi
            unzip -q ../downloads/clang-r510928.zip -d clang18
          else
            echo "Using cached clang18."
          fi

          if [[ ! -d build-tools/bin ]]; then
            if [[ ! -s ../downloads/build-tools.zip ]]; then
              aria2c -s16 -x16 -k1M "${TOOLCHAIN_URL}/build-tools.zip" -o ../downloads/build-tools.zip
            fi
            unzip -q ../downloads/build-tools.zip
          else
            echo "Using cached build-tools."
          fi

      - name: Configure kernel tree
        env:
          KERNEL_SUFFIX: ${{ steps.vars.outputs.kernel_suffix }}
        run: |
          set -euxo pipefail
          export PATH="${GITHUB_WORKSPACE}/kernel_workspace/clang18/bin:${GITHUB_WORKSPACE}/kernel_workspace/build-tools/bin:${PATH}"
          KERNEL_OUT="${GITHUB_WORKSPACE}/kernel_workspace/out"
          cd kernel_workspace/common
          KERNEL_SUFFIX="${KERNEL_SUFFIX#-}"

          rm -f android/abi_gki_protected_exports_* || true
          for f in scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i 's/${scm_version}//' "$f"
            sed -i -E '$s|echo ".*"|echo ""|' "$f"
          done
          sed -i '/^CONFIG_LOCALVERSION=/d' arch/x86/configs/gki_defconfig
          sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' arch/x86/configs/gki_defconfig
          printf 'CONFIG_LOCALVERSION="-%s"\nCONFIG_LOCALVERSION_AUTO=n\n' "$KERNEL_SUFFIX" >> arch/x86/configs/gki_defconfig

            # Patch kernel version to match target device (6.1.90)
            sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 90/' Makefile
            sed -i 's/^EXTRAVERSION = .*/EXTRAVERSION = -perf+/' Makefile

            # Disable features not present in 6.1.90 kernel
            printf 'CONFIG_CFI_CLANG=n\nCONFIG_DEBUG_INFO_BTF=n\nCONFIG_KCFI=n\n' >> arch/x86/configs/gki_defconfig

          make -j"$(nproc)" LLVM=1 ARCH=x86 \
            CC=clang LD=ld.lld HOSTLD=ld.lld O="$KERNEL_OUT" \
            KCFLAGS+=-O2 KCFLAGS+=-Wno-error \
            gki_defconfig

          grep -E 'CONFIG_(MODULES|KPROBES|KRETPROBES)=' "$KERNEL_OUT/.config" || true
          grep -q '^CONFIG_MODULES=y$' "$KERNEL_OUT/.config"
          grep -q '^CONFIG_KPROBES=y$' "$KERNEL_OUT/.config"
          grep -q '^CONFIG_KRETPROBES=y$' "$KERNEL_OUT/.config"

      - name: Prepare kernel build outputs
        env:
          FULL_KERNEL_BUILD: ${{ inputs.full_kernel_build || 'false' }}
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          export PATH="${GITHUB_WORKSPACE}/kernel_workspace/clang18/bin:${GITHUB_WORKSPACE}/kernel_workspace/build-tools/bin:${PATH}"
          KERNEL_OUT="${GITHUB_WORKSPACE}/kernel_workspace/out"
          cd kernel_workspace/common

          build_modules_for_symvers() {
            local log="${GITHUB_WORKSPACE}/kernel-modules.log"
            echo "::group::Build in-tree modules for Module.symvers"
            make -j"$(nproc)" LLVM=1 ARCH=x86 \
              CC=clang LD=ld.lld HOSTLD=ld.lld O="$KERNEL_OUT" \
              KCFLAGS+=-O2 KCFLAGS+=-Wno-error \
              modules >"$log" 2>&1 &
            local make_pid=$!
            while kill -0 "$make_pid" 2>/dev/null; do
              sleep 60
              echo "--- still building in-tree modules: $(date -u '+%Y-%m-%d %H:%M:%S UTC') ---"
              tail -n 25 "$log" || true
            done
            if ! wait "$make_pid"; then
              tail -n 300 "$log" || true
              echo "::endgroup::"
              exit 1
            fi
            tail -n 80 "$log" || true
            echo "::endgroup::"
          }

          if [[ "$FULL_KERNEL_BUILD" == "true" ]]; then
            build_modules_for_symvers
          fi

          make -j"$(nproc)" LLVM=1 ARCH=x86 \
            CC=clang LD=ld.lld HOSTLD=ld.lld O="$KERNEL_OUT" \
            KCFLAGS+=-O2 KCFLAGS+=-Wno-error \
            modules_prepare

          make -s LLVM=1 ARCH=x86 O="$KERNEL_OUT" kernelrelease | tee "${GITHUB_WORKSPACE}/kernelrelease.txt"
          if [[ ! -s "$KERNEL_OUT/Module.symvers" ]]; then
            echo "::warning::Module.symvers is missing after modules_prepare; building in-tree modules once to generate kernel symbol versions."
            build_modules_for_symvers
            make -j"$(nproc)" LLVM=1 ARCH=x86 \
              CC=clang LD=ld.lld HOSTLD=ld.lld O="$KERNEL_OUT" \
              KCFLAGS+=-O2 KCFLAGS+=-Wno-error \
              modules_prepare
          fi

          if [[ ! -s "$KERNEL_OUT/Module.symvers" ]]; then
            echo "::warning::Module.symvers is still missing after in-tree modules. External module build will use KBUILD_MODPOST_WARN=1 and may fail to load on MODVERSIONS kernels."
            echo "KBUILD_MODPOST_WARN=1" >> "$GITHUB_ENV"
          else
            echo "KBUILD_MODPOST_WARN=0" >> "$GITHUB_ENV"
          fi

      - name: Build external module
        run: |
          set -euxo pipefail
          export PATH="${GITHUB_WORKSPACE}/kernel_workspace/clang18/bin:${GITHUB_WORKSPACE}/kernel_workspace/build-tools/bin:${PATH}"
          KERNEL_OUT="${GITHUB_WORKSPACE}/kernel_workspace/out"

          echo "::group::External module sources"
          ls -la "${GITHUB_WORKSPACE}"/{Kbuild,Makefile,selinux_seqno_fix.c}
          echo "::endgroup::"

          make -C "${GITHUB_WORKSPACE}/kernel_workspace/common" O="$KERNEL_OUT" M="${GITHUB_WORKSPACE}" \
            LLVM=1 ARCH=x86 \
            CC=clang LD=ld.lld HOSTLD=ld.lld \
            KBUILD_MODPOST_WARN="${KBUILD_MODPOST_WARN:-0}" \
            KCFLAGS+=-O2 KCFLAGS+=-Wno-error \
            V=1 \
            modules

          if [[ ! -f "${GITHUB_WORKSPACE}/${MODULE_NAME}.ko" ]]; then
            echo "::error::External module build finished but ${MODULE_NAME}.ko was not produced."
            echo "modules.order:"
            cat "${GITHUB_WORKSPACE}/modules.order" 2>/dev/null || echo "<missing>"
            ls -la "${GITHUB_WORKSPACE}" || true
            exit 1
          fi
          modinfo "${GITHUB_WORKSPACE}/${MODULE_NAME}.ko" | tee modinfo.txt || true

      - name: Package artifacts
        run: |
          set -euxo pipefail
          KERNEL_RELEASE="$(cat kernelrelease.txt)"
          VERSION_TAG="${KERNEL_RELEASE}-${GITHUB_RUN_NUMBER}"
          ARTIFACT_DIR="artifacts/${MODULE_NAME}-${KERNEL_RELEASE}"
          mkdir -p "$ARTIFACT_DIR" package

          cp "${MODULE_NAME}.ko" "$ARTIFACT_DIR/"
          cp modinfo.txt kernelrelease.txt "$ARTIFACT_DIR/"
          if [[ "${KBUILD_MODPOST_WARN:-0}" == "1" ]]; then
            cat > "$ARTIFACT_DIR/MODPOST_WARN.txt" <<'EOF'
          KBUILD_MODPOST_WARN=1 was used because the kernel tree did not provide Module.symvers.
          This .ko may fail to load on kernels that enforce CONFIG_MODVERSIONS.
          EOF
          fi
          sha256sum "$ARTIFACT_DIR/${MODULE_NAME}.ko" | tee "$ARTIFACT_DIR/${MODULE_NAME}.ko.sha256"

          cp -r ksu-module/* package/
          cp "${MODULE_NAME}.ko" package/
          (cd package && zip -r "../$ARTIFACT_DIR/${MODULE_NAME}-ksu-module-${VERSION_TAG}.zip" .)

          (cd artifacts && zip -r "${MODULE_NAME}-${VERSION_TAG}.zip" "${MODULE_NAME}-${KERNEL_RELEASE}")

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selinux_seqno_fix-ko
          path: artifacts/**
